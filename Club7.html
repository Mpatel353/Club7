<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club7</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }
    header {
      background: #172033;
      color: white;
      padding: 18px 24px;
      text-align: center;
    }
    .hero {
      max-width: 900px;
      margin: 50px auto;
      padding: 45px 25px;
      text-align: center;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 12px; font-size: 42px; }
    p { font-size: 18px; line-height: 1.6; }
    .btn {
      display: inline-block;
      margin-top: 18px;
      padding: 13px 24px;
      border-radius: 10px;
      background: #172033;
      color: white;
      text-decoration: none;
    }
    footer {
      text-align: center;
      padding: 25px;
      color: #667085;
    }
  </style>
</head>
<body>
  <header>
    <strong>Club7</strong>
  </header>

  <main class="hero">
    <h1>Welcome to Club7</h1>
    <p>A simple, clean Club7 website.</p>
    <a class="btn" href="#about">Learn More</a>
    <div id="about">
      <h2>About Club7</h2>
      <p>This website can be customized with your own business or community information.</p>
    </div>
  </main>

  <footer>© 2026 Club7. All rights reserved.</footer>
</body>
</html>
